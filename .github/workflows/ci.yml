name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Compile check: catches syntax errors and bad imports across the app.
      # journey-cloner/ and journey-planner/ are included because the planner
      # contract lives there and was previously not even syntax-checked.
      - name: Compile sources
        run: python -m compileall -q app server.py journey-cloner journey-planner

      # Standalone unit tests (no network, no browser, no live server).
      - name: Embedded odds extraction test
        run: python scripts/test_embedded_odds.py

      - name: Match deactivation logic test
        run: python scripts/test_deactivate_not_seen.py

      - name: Parser drift canary classification test
        run: python scripts/test_drift_canary.py

      # Planner LLM -> compose.py contract: refusal gates, game-id grounding,
      # and that recipes_catalog.json (injected verbatim into the prompt) is not
      # stale relative to compose.py's RECIPES.
      - name: Composer contract test
        run: python scripts/test_composer_contract.py

      # Migrations must apply cleanly from scratch on a temp database.
      - name: Alembic migrations apply
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          python scripts/init_db.py

  # Advisory security scans. Non-blocking (continue-on-error) so a freshly
  # disclosed transitive CVE surfaces as a warning without wedging deploys;
  # review the step output and bump via the Dependabot PRs it opens.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit (known-vulnerable dependencies)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: bandit (Python static security scan)
        continue-on-error: true
        run: bandit -q -r app server.py -x app/static
